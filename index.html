<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Checkout 离线自测</title><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head><body><header><strong class="mark">P</strong><strong>Checkout 自测台</strong><span class="badge">离线模拟</span></header><main><h1>跳转收银台</h1><p>仅在当前浏览器模拟，不连接支付网关，不扣款。</p><div class="grid"><section id="create"><h2>创建测试订单</h2><form><label>支付路由<select id="method"><option>SG · SGD · Paynow</option><option>SG · SGD · WeChat Pay</option></select></label><label>订单金额（SGD）<input id="amount" value="10.00" inputmode="decimal" pattern="[0-9]{1,9}(\.[0-9]{1,2})?" required></label><button>创建并打开模拟收银台</button></form></section><section hidden id="pay"><h2>模拟收银台</h2><p id="detail"></p><button id="finish">模拟支付成功</button> <button class="secondary" id="back">返回，不支付</button></section><section><div class="heading"><h2>近期订单</h2><button class="secondary" id="query">查询状态</button></div><ul id="orders"></ul><p id="msg" role="status"></p></section></div></main></body></html>
